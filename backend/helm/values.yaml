# =======================================
# Deployment Configuration
# =======================================
image:
  # repository: ghcr.io/<GITHUB_OWNER>/<REPOSITORY_NAME>/backend
  # tag: "dev"
  repository: ghcr.io/leodev901/vehicle-manual-poc/backend
  tag: "latest"
  pullPolicy: Always
containers:
  replicas: 1
  requests:
    cpu: "256m"
    memory: "256Mi"
  limits:
    cpu: "512m"
    memory: "512Mi"

# =======================================
# Service Configuration
# =======================================
service:
  name: "vehicle-manual-poc-api"
  port: 80
  targetPort: 8080
  host: "0.0.0.0"
  log_level: "info"
  
  # Gunicorn Worker 설정
  worker: 1
  workerTimeout: 180

# =======================================
# Autoscaling Configuration (HPA)
# =======================================
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300

# # =======================================
# # Autoscaling Configuration (KEDA) - 미사용
# # =======================================
# scaleobject:
#   enabled: true
#   pollingInterval: 30
#   cooldownPeriod: 300
#   minReplicaCount: 1
